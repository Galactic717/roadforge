name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: Python lint
        run: ruff check src tests e2e
      - name: Python format
        run: ruff format --check src tests e2e
      - name: Browser syntax
        run: node --check web/app.js
      - name: Evaluate committed model
        run: roadforge evaluate --model data/pretrained_model.json
      - name: Run paired benchmark
        run: roadforge benchmark --model data/pretrained_model.json --no-save --summary
      - name: Run generated-road stress benchmark
        run: roadforge benchmark --model data/pretrained_model.json --no-save --stress --summary

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: python -m pip install -e ".[e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise editor and training in browser
        run: python -m pytest e2e -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t roadforge:ci .
      - name: Smoke test service
        run: |
          docker run -d --name roadforge-ci -p 127.0.0.1:8765:8765 roadforge:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs roadforge-ci
          exit 1
