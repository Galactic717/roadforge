[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "roadforge"
version = "0.1.0"
description = "Local-first road world builder and autonomous driving laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Galactic717"}]
keywords = ["autonomous-driving", "simulation", "neural-network", "road-editor"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
e2e = ["pytest>=8", "playwright>=1.55"]

[project.scripts]
roadforge = "roadforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roadforge"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "roadforge/assets/web"
"data/pretrained_model.json" = "roadforge/assets/pretrained_model.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
